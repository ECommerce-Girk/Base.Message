name: CI/CD NuGet Package

on:
  push:
    branches: [ "**" ]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    
    # Required so the built-in GITHUB_TOKEN has permission to push to GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Generate Dynamic Version
      id: versioning
      shell: bash
      run: |
        # Generate YYMM.DD format + GitHub run number (similar to ADO Date/Rev)
        DATE_PREFIX=$(date +'%y%m.%d')
        BASE_VERSION="${DATE_PREFIX}.${{ github.run_number }}"
        
        # Add -alpha suffix if not on main branch
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          NUGET_VERSION="${BASE_VERSION}-alpha"
        else
          NUGET_VERSION="${BASE_VERSION}"
        fi
        
        echo "NugetVersion=$NUGET_VERSION" >> $GITHUB_ENV
        echo "Building NuGet version: $NUGET_VERSION"

    - name: Setup NuGet Source for GitHub Packages
      run: |
        dotnet nuget add source "https://nuget.pkg.github.com/ECommerce-Girk/index.json" \
          --name "github" \
          --username "github" \
          --password "${{ secrets.GITHUB_TOKEN }}" \
          --store-password-in-clear-text

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build Base.Message/Base.Message.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack Base.Message/Base.Message.csproj --configuration Release --no-restore --output ./artifacts /p:Version=${{ env.NugetVersion }}
    - name: Push to GitHub Packages
      run: |
        dotnet nuget push "./artifacts/*.nupkg" \
          --source "https://nuget.pkg.github.com/ECommerce-Girk/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate